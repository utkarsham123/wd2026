<!DOCTYPE html>
<html>
<head>
    <title>Scholarship / Seminar Registration Form</title>
</head>
<body>

<h2>Scholarship / Seminar Registration Form</h2>

<form>
    <fieldset>
        <legend>Personal Information</legend>

        <label>Full Name:</label>
        <input type="text" name="fullname"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Mobile Number:</label>
        <input type="text" name="mobile"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
    </fieldset>

    <br>

    <fieldset>
        <legend>Academic / Registration Details</legend>

        <label>Select Course:</label>
        <select name="course">
            <option>B.Tech</option>
            <option>B.Sc</option>
            <option>BCA</option>
            <option>MCA</option>
        </select><br><br>

        <label>Purpose:</label>
        <input type="radio" name="purpose" value="Scholarship"> Scholarship
        <input type="radio" name="purpose" value="Seminar"> Seminar
        <br><br>

        <label>Interested Topics:</label><br>
        <input type="checkbox" name="topic" value="AI"> AI
        <input type="checkbox" name="topic" value="Web Development"> Web Development
        <input type="checkbox" name="topic" value="Cyber Security"> Cyber Security
        <input type="checkbox" name="topic" value="Data Science"> Data Science
        <br><br>

        <label>Address:</label>
        <input type="text" name="address"><br><br>

        <input type="checkbox" name="agree"> I confirm that the above information is correct.
    </fieldset>

    <br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>

</body>
</html>
