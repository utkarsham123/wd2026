<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center">

    <div class="bg-white p-6 rounded-xl shadow-lg w-96">

        <h1 class="text-2xl font-bold text-center text-blue-600 mb-5">
            Personal To-Do List
        </h1>

        <div class="flex gap-2">

            <input
                id="taskInput"
                type="text"
                placeholder="Enter task"
                class="border p-2 rounded w-full"
            >

            <button
                onclick="addTask()"
                class="bg-blue-500 text-white px-4 rounded hover:bg-blue-600"
            >
                Add
            </button>

        </div>

        <p class="mt-4 text-gray-600">
            Total Tasks: <span id="count">0</span>
        </p>

        <ul id="taskList" class="mt-4 space-y-2"></ul>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            li.className =
                "flex justify-between items-center bg-gray-100 p-3 rounded";

            // Task text
            let span = document.createElement("span");
            span.innerText = task;

            // Complete task
            span.onclick = function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            };

            // Delete button
            let button = document.createElement("button");

            button.innerText = "Delete";

            button.className =
                "bg-red-500 text-white px-3 py-1 rounded";

            button.onclick = function () {
                li.remove();
                updateCount();
            };

            li.appendChild(span);
            li.appendChild(button);

            document.getElementById("taskList").appendChild(li);

            input.value = "";

            updateCount();
        }

        function updateCount() {

            let list = document.getElementById("taskList");

            document.getElementById("count").innerText =
                list.children.length;
        }

    </script>

</body>
</html>
